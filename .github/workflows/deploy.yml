# Publishes the site on every push to main, including each save in the site editor (admin/).
# tools/build-pages.py makes the project pages, link-preview pictures and sitemap first; they're never committed.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# saves made close together publish one after another, never at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pillow
      - name: Build the project pages, link previews and sitemap
        run: python tools/build-pages.py
      - name: Leave the build tools out of the site
        run: rm -rf tools
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
